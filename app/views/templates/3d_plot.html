<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stock Visualizer</title>
    <style>
        body { margin: 0; background-color: #1E1E1E; color: #FFFFFF; font-family: sans-serif; }
        canvas { display: block; }
        #tooltip {
            position: absolute;
            display: none;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 5px;
            color: white;
            pointer-events: none; /* Allows mouse events to pass through */
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
    // --- Data Injection Placeholder ---
    const stockData = __PLOT_DATA__;

        // --- Basic Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // soft white light
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // --- Data Visualization ---
        const pointsGroup = new THREE.Group();
        const geometry = new THREE.SphereGeometry(0.02, 16, 16); // Small sphere for each stock

        stockData.forEach(stock => {
            // Map normalized data (0 to 1) to a 3D space (e.g., -5 to 5)
            const x = stock.x * 10 - 5;
            const y = stock.y * 10 - 5;
            const z = stock.z * 10 - 5;

            // Color based on Z-value (upside potential)
            const color = new THREE.Color();
            color.setHSL(0.7 - (stock.z * 0.7), 0.9, 0.6); // Blue (low) to Red (high)

            const material = new THREE.MeshLambertMaterial({ color: color });
            const point = new THREE.Mesh(geometry, material);
            point.position.set(x, y, z);
            point.userData = { ticker: stock.Ticker }; // Store ticker for tooltip
            pointsGroup.add(point);
        });
        scene.add(pointsGroup);

        // --- Axes Helper ---
        const axesHelper = new THREE.AxesHelper(6); // X=red, Y=green, Z=blue
        scene.add(axesHelper);

        // --- Camera Position ---
        camera.position.z = 12;

        // --- Interactivity (Mouse Controls) ---
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        document.addEventListener('mousedown', e => { isMouseDown = true; });
        document.addEventListener('mouseup', e => { isMouseDown = false; });
        
        document.addEventListener('mousemove', e => {
            const deltaMove = {
                x: e.offsetX - previousMousePosition.x,
                y: e.offsetY - previousMousePosition.y
            };

            if (isMouseDown) {
                pointsGroup.rotation.y += deltaMove.x * 0.005;
                pointsGroup.rotation.x += deltaMove.y * 0.005;
            }
            
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
            
            // Tooltip logic
            updateTooltip(e);
        });

        document.addEventListener('wheel', e => {
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(3, Math.min(25, camera.position.z)); // Clamp zoom
        });

        // --- Tooltip Logic ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');

        function updateTooltip(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pointsGroup.children);

            if (intersects.length > 0) {
                const ticker = intersects[0].object.userData.ticker;
                tooltip.style.display = 'block';
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 'px';
                tooltip.textContent = ticker;
            } else {
                tooltip.style.display = 'none';
            }
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // --- Window Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

    </script>
</body>
</html>
